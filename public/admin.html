<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>LootLevel Admin</title>
  <style>
    :root {
      --bg: #12141a;
      --card: #1b1e27;
      --line: #2a2e3a;
      --text: #e8eaf0;
      --muted: #9aa1b2;
      --accent: #6ea8fe;
      --good: #4ade80;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    h1 { font-size: 1.1rem; margin: 0; }
    .muted { color: var(--muted); font-size: .875rem; }
    main { padding: 1.25rem; max-width: 900px; margin: 0 auto; }
    button {
      font: inherit;
      border: 1px solid var(--line);
      background: #232733;
      color: var(--text);
      padding: .5rem .9rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.approve { border-color: #2f6b45; }
    button.reject { border-color: #6b2f2f; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: .75rem;
    }
    .row { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .title { font-weight: 600; }
    .cost { color: var(--accent); font-weight: 600; }
    .payout {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #232733;
      padding: .15rem .4rem;
      border-radius: 4px;
    }
    /* The fulfilment block: everything needed to deliver an order by hand,
       grouped so it can be read top to bottom without hunting. */
    .fulfil {
      margin-top: .75rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .fulfil div {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: .4rem .65rem;
      border-bottom: 1px solid var(--line);
      font-size: .875rem;
    }
    .fulfil div:last-child { border-bottom: 0; }
    .fulfil .k { color: var(--muted); }
    .fulfil .v {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: right;
      word-break: break-all;
    }
    /* Player ID and username are the two fields that get mistyped into a
       game client, so they are the ones made copyable. */
    .copy {
      cursor: pointer;
      border-bottom: 1px dotted var(--muted);
    }
    .copy:hover { color: var(--accent); border-color: var(--accent); }
    .amount { color: var(--good); font-weight: 600; font-size: 1.05rem; }
    .cost-sub { color: var(--muted); font-size: .8rem; }
    .support-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted);
      font-size: .8rem;
    }
    .first-badge {
      display: inline-block;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 4px;
      padding: 0 .35rem;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    /* The device badge. Three states, because "one account" and "we have no
       device on file" are different things and only one of them is
       reassuring. */
    .device-badge {
      display: inline-block;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 4px;
      padding: 0 .35rem;
      font-size: .7rem;
      letter-spacing: .04em;
      cursor: pointer;
    }
    .device-badge.shared { border-color: #8a6d1f; color: #fbbf24; }
    .device-badge.unknown { border-color: var(--line); color: #6b7280; }
    .actions { display: flex; gap: .5rem; margin-top: .75rem; flex-wrap: wrap; }
    .empty { color: var(--muted); text-align: center; padding: 3rem 1rem; }
    .banner {
      padding: .75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      border: 1px solid var(--line);
    }
    .banner.error { border-color: #6b2f2f; color: #fca5a5; }
    .banner.ok { border-color: #2f6b45; color: #86efac; }
    /* The settlement panel. Set apart from the redemption queue above it by a
       rule rather than a card, because it is a different job on the same
       page, not another item in the list. */
    #settle {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }
    #settle h2 { font-size: 1rem; margin: 0 0 .35rem; }
    #settle p { margin: 0 0 .9rem; max-width: 60ch; }
    #settleResult { margin-top: .6rem; }
    input {
      font: inherit;
      border: 1px solid var(--line);
      background: #232733;
      color: var(--text);
      padding: .5rem .7rem;
      border-radius: 6px;
      width: 11rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
    .tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
    .status { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
    .status.pending { color: var(--accent); }
    .status.approved { color: var(--good); }
    .status.rejected { color: var(--bad); }

    /* ---- Support ---- */
    .views { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
    .views button[aria-selected="true"] { background: var(--accent); color: #0b1020; border-color: var(--accent); }
    .ticket { cursor: pointer; }
    .ticket:hover { border-color: var(--accent); }
    .unread-dot {
      display: inline-block; width: .55rem; height: .55rem; border-radius: 50%;
      background: var(--accent); margin-right: .4rem; vertical-align: middle;
    }
    .cat {
      display: inline-block; border: 1px solid var(--line); color: var(--muted);
      border-radius: 4px; padding: 0 .35rem; font-size: .7rem; text-transform: uppercase;
      letter-spacing: .04em;
    }
    .thread { display: flex; flex-direction: column; gap: .5rem; margin: .75rem 0; }
    .msg { max-width: 80%; padding: .55rem .75rem; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { background: #232733; align-self: flex-start; }
    .msg.admin { background: #1f3a5f; align-self: flex-end; }
    .msg .when { display: block; color: var(--muted); font-size: .72rem; margin-top: .2rem; }
    textarea {
      font: inherit; width: 100%; min-height: 7rem; resize: vertical;
      border: 1px solid var(--line); background: #232733; color: var(--text);
      padding: .6rem .7rem; border-radius: 6px;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LootLevel Admin</h1>
      <div class="muted" id="who">Not signed in</div>
    </div>
    <div class="actions" style="margin:0">
      <button id="signIn">Sign in with Google</button>
      <button id="signOut" hidden>Sign out</button>
      <button id="refresh" hidden>Refresh</button>
    </div>
  </header>

  <main>
    <div id="banner" hidden></div>

    <div class="views" id="views" hidden>
      <button data-view="orders" aria-selected="true">Redemptions</button>
      <button data-view="support" aria-selected="false">Support</button>
    </div>

    <section id="supportView" hidden>
      <div class="tabs" id="supportTabs">
        <button data-status="open" aria-selected="true">Needs reply</button>
        <button data-status="answered" aria-selected="false">Answered</button>
        <button data-status="resolved" aria-selected="false">Closed</button>
      </div>
      <div id="supportList"></div>
      <div id="supportThread" hidden></div>
    </section>

    <section id="ordersView">
    <div class="tabs" id="tabs" hidden>
      <button data-status="pending" aria-selected="true">Pending</button>
      <button data-status="approved" aria-selected="false">Approved</button>
      <button data-status="rejected" aria-selected="false">Rejected</button>
    </div>

    <div id="list"></div>

    <!--
      The leaderboard has been showing prizes since it shipped and nothing
      paid them. settleWeeklyLeaderboard covers every week from now on; this
      is how the unpaid ones get settled, one week at a time. Safe to press
      twice - the settlement is idempotent and reports a week already done.
    -->
    <section id="settle" hidden>
      <h2>Weekly leaderboard</h2>
      <p class="muted">
        Pays the prizes for a finished week. Leave the box empty for the week
        that just ended, or enter a week number to settle an older one. A week
        already settled is reported, not paid again.
      </p>
      <div class="actions" style="margin:0">
        <input id="settleWeek" type="number" placeholder="Week (optional)" />
        <button id="settleRun">Settle week</button>
      </div>
      <div class="muted" id="settleResult"></div>
    </section>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut,
      onAuthStateChanged, getIdTokenResult,
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getFunctions, httpsCallable,
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";

    const app = initializeApp({
      apiKey: "AIzaSyBQKipI7SOJKByN8gSzzAZc-Umt4NrT7Rw",
      authDomain: "pixelpayout-check.firebaseapp.com",
      projectId: "pixelpayout-check",
      storageBucket: "pixelpayout-check.firebasestorage.app",
      messagingSenderId: "461737828827",
      appId: "1:461737828827:web:d030b243499c727e58c7fe",
    });

    const auth = getAuth(app);
    const fns = getFunctions(app);

    const el = (id) => document.getElementById(id);
    const listEl = el("list");
    let currentStatus = "pending";

    function banner(message, kind = "error") {
      const b = el("banner");
      b.textContent = message;
      b.className = `banner ${kind}`;
      b.hidden = !message;
    }

    function fmtDate(millis) {
      if (!millis) return "";
      return new Date(millis).toLocaleString();
    }

    el("signIn").onclick = async () => {
      banner("");
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (e) {
        banner(e.message);
      }
    };
    el("signOut").onclick = () => fbSignOut(auth);
    el("refresh").onclick = () => (currentView === "support" ? loadTickets() : load());

    // ---- Views: redemptions / support ----
    let currentView = "orders";
    for (const v of el("views").querySelectorAll("button")) {
      v.onclick = () => {
        currentView = v.dataset.view;
        for (const b of el("views").querySelectorAll("button")) {
          b.setAttribute("aria-selected", String(b === v));
        }
        el("ordersView").hidden = currentView !== "orders";
        el("supportView").hidden = currentView !== "support";
        banner("");
        if (currentView === "support") loadTickets(); else load();
      };
    }

    // ---- Support ----
    const CATEGORY_LABELS = {
      redemption: "Redemption", missing_reward: "Missing reward", account: "Account",
      referral: "Referral", bug: "Bug", other: "Other",
    };
    let ticketStatus = "open";

    for (const tab of el("supportTabs").querySelectorAll("button")) {
      tab.onclick = () => {
        ticketStatus = tab.dataset.status;
        for (const t of el("supportTabs").querySelectorAll("button")) {
          t.setAttribute("aria-selected", String(t === tab));
        }
        loadTickets();
      };
    }

    async function loadTickets() {
      el("supportThread").hidden = true;
      el("supportList").hidden = false;
      el("supportList").innerHTML = '<div class="empty">Loading…</div>';
      try {
        const res = await httpsCallable(fns, "listSupportTickets")({status: ticketStatus});
        renderTickets(res.data?.tickets ?? []);
      } catch (e) {
        el("supportList").innerHTML = "";
        banner(`Could not load tickets: ${e.message}`);
      }
    }

    function renderTickets(tickets) {
      const list = el("supportList");
      if (!tickets.length) {
        list.innerHTML = '<div class="empty">No tickets here.</div>';
        return;
      }
      list.innerHTML = "";
      for (const t of tickets) {
        const card = document.createElement("div");
        card.className = "card ticket";
        card.innerHTML = `
          <div class="row">
            <div>
              <div class="title">${t.adminUnread ? '<span class="unread-dot"></span>' : ""}${escapeHtml(t.subject)}</div>
              <div class="muted">${escapeHtml(t.displayName || "")} ${t.email ? "&middot; " + escapeHtml(t.email) : ""}</div>
              <div class="muted"><span class="cat">${escapeHtml(CATEGORY_LABELS[t.category] || t.category)}</span>
                ${t.orderLabel ? "&middot; " + escapeHtml(t.orderLabel) : ""}</div>
            </div>
            <div style="text-align:right">
              <div class="muted">${fmtDate(t.lastMessageAtMillis)}</div>
              <div class="muted">${Number(t.messageCount || 0)} messages &middot; last by ${escapeHtml(t.lastMessageFrom || "")}</div>
            </div>
          </div>`;
        card.onclick = () => openTicket(t.id);
        list.append(card);
      }
    }

    async function openTicket(ticketId) {
      const box = el("supportThread");
      el("supportList").hidden = true;
      box.hidden = false;
      box.innerHTML = '<div class="empty">Loading…</div>';
      try {
        const res = await httpsCallable(fns, "getSupportTicket")({ticketId});
        renderThread(res.data);
      } catch (e) {
        box.innerHTML = "";
        banner(`Could not open ticket: ${e.message}`);
      }
    }

    function renderThread(data) {
      const t = data.ticket;
      const a = data.account;
      const box = el("supportThread");
      const closed = t.status === "resolved";
      box.innerHTML = `
        <div class="actions" style="margin:0 0 .75rem"><button id="backToTickets">&larr; All tickets</button></div>
        <div class="card">
          <div class="row">
            <div>
              <div class="title">${escapeHtml(t.subject)}</div>
              <div class="muted">${escapeHtml(t.displayName)} &middot; ${escapeHtml(t.email)}</div>
              <div class="muted"><span class="cat">${escapeHtml(CATEGORY_LABELS[t.category] || t.category)}</span>
                ${t.orderLabel ? "&middot; " + escapeHtml(t.orderLabel) : ""}
                ${t.appVersion ? "&middot; app " + escapeHtml(t.appVersion) : ""}</div>
              <div class="support-id copy" data-copy="${escapeHtml(t.uid)}" title="Click to copy">uid ${escapeHtml(t.uid)}</div>
            </div>
            <div style="text-align:right">
              <div class="status">${escapeHtml(t.status)}</div>
              ${a ? `<div class="cost">${Number(a.points).toLocaleString()}</div>
                     <div class="cost-sub">stars &middot; level ${Number(a.level)}</div>` :
                   '<div class="cost-sub">account deleted</div>'}
            </div>
          </div>
          <div class="thread">
            ${data.messages.map((m) => `
              <div class="msg ${m.from === "admin" ? "admin" : "user"}">${escapeHtml(m.text)}
                <span class="when">${m.from === "admin" ? "Support" : "User"} &middot; ${fmtDate(m.createdAtMillis)}</span>
              </div>`).join("")}
          </div>
          ${!closed && Number(t.userMessagesSinceReply || 0) >= 2
            ? '<div class="muted">The user has sent 2 messages and can’t send more until you reply.</div>' : ""}
          ${closed ? '<div class="muted">This ticket is closed. The user can open a new one.</div>' : `
            <textarea id="replyText" placeholder="Reply to the user…" maxlength="4000"></textarea>
            <div class="actions">
              <button id="sendReply" class="approve">Send reply</button>
              <button id="sendClose">Send &amp; close</button>
              <button id="closeOnly" class="reject">Close without reply</button>
            </div>`}
        </div>`;

      el("backToTickets").onclick = () => loadTickets();
      for (const target of box.querySelectorAll("[data-copy]")) {
        target.onclick = async () => {
          try {
            await navigator.clipboard.writeText(target.dataset.copy);
            banner(`Copied ${target.dataset.copy}`, "ok");
          } catch {
            banner("Could not copy - select the text instead.");
          }
        };
      }
      if (closed) return;

      const send = async (resolve) => {
        const message = el("replyText").value.trim();
        if (message.length < 10) {
          banner("A reply needs at least 10 characters.");
          return;
        }
        for (const b of box.querySelectorAll("button")) b.disabled = true;
        try {
          await httpsCallable(fns, "adminReplySupportTicket")({ticketId: t.id, message, resolve});
          banner(resolve ? "Reply sent and ticket closed." : "Reply sent.", "ok");
          openTicket(t.id);
        } catch (e) {
          banner(e.message);
          for (const b of box.querySelectorAll("button")) b.disabled = false;
        }
      };
      el("sendReply").onclick = () => send(false);
      el("sendClose").onclick = () => send(true);
      el("closeOnly").onclick = async () => {
        if (!confirm("Close this ticket without replying?")) return;
        try {
          await httpsCallable(fns, "adminCloseSupportTicket")({ticketId: t.id});
          banner("Ticket closed.", "ok");
          loadTickets();
        } catch (e) {
          banner(e.message);
        }
      };
    }

    el("settleRun").onclick = async () => {
      const raw = el("settleWeek").value.trim();
      const payload = raw === "" ? {} : {weekKey: Number(raw)};
      const which = raw === "" ? "the week that just ended" : `week ${raw}`;

      if (!confirm(`Pay leaderboard prizes for ${which}?`)) return;

      el("settleRun").disabled = true;
      el("settleResult").textContent = "Settling…";
      try {
        const res = await httpsCallable(fns, "settleLeaderboardNow")(payload);
        const d = res.data ?? {};
        el("settleResult").textContent = d.alreadySettled
          ? `Week ${d.weekKey} was already settled — nothing paid.`
          : `Week ${d.weekKey}: paid ${d.paid} of ${d.winners} winners, ` +
            `${(d.pointsPaid ?? 0).toLocaleString()} stars.`;
        banner("");
      } catch (e) {
        el("settleResult").textContent = "";
        banner(e.message);
      } finally {
        el("settleRun").disabled = false;
      }
    };

    for (const tab of el("tabs").querySelectorAll("button")) {
      tab.onclick = () => {
        currentStatus = tab.dataset.status;
        for (const t of el("tabs").querySelectorAll("button")) {
          t.setAttribute("aria-selected", String(t === tab));
        }
        load();
      };
    }

    onAuthStateChanged(auth, async (user) => {
      el("signIn").hidden = !!user;
      el("signOut").hidden = !user;
      el("refresh").hidden = !user;
      el("tabs").hidden = !user;
      el("settle").hidden = !user;
      el("views").hidden = !user;
      listEl.innerHTML = "";
      banner("");

      el("settleResult").textContent = "";

      if (!user) {
        el("who").textContent = "Not signed in";
        return;
      }

      el("who").textContent = user.email;

      // Custom claims live in the ID token, so a freshly-granted admin claim
      // only appears after the token is refreshed.
      let token = await getIdTokenResult(user);
      if (token.claims.admin !== true) {
        try {
          await httpsCallable(fns, "bootstrapAdmin")({});
          token = await getIdTokenResult(user, true);
        } catch (e) {
          banner(`This account is not an admin (${user.email}).`);
          return;
        }
      }

      if (token.claims.admin !== true) {
        banner("Admin claim not present. Sign out and back in, then retry.");
        return;
      }

      load();
    });

    async function load() {
      listEl.innerHTML = '<div class="empty">Loading…</div>';
      banner("");
      try {
        const res = await httpsCallable(fns, "listRedemptions")({status: currentStatus});
        render(res.data?.redemptions ?? []);
      } catch (e) {
        listEl.innerHTML = "";
        banner(`Could not load redemptions: ${e.message}`);
      }
    }

    function render(rows) {
      if (!rows.length) {
        listEl.innerHTML = `<div class="empty">No ${currentStatus} redemptions.</div>`;
        return;
      }

      listEl.innerHTML = "";
      for (const r of rows) {
        const card = document.createElement("div");
        card.className = "card";

        // What is actually being delivered. packAmount is the game currency
        // ("325 UC"); the star cost is what it was bought for and is
        // secondary here - nobody fulfils an order in stars.
        const amount = r.packAmount || r.optionTitle || r.optionId || "Reward";

        // The support id the player sees in their Orders tab. Same last 8
        // characters, same case, so a pasted id matches on sight.
        const supportId = String(r.id || "").slice(-8).toUpperCase();

        const rows_ = [
          ["Game", r.optionTitle || r.optionId || ""],
          ["Player ID", r.playerId || "", true],
          ["Username", r.username || "", true],
          ["Server", r.server || ""],
        ].filter(([, v]) => v !== "");

        // A legacy cash payout, from before redemption moved to game packs.
        if (r.payoutNumber) rows_.push(["Payout number", r.payoutNumber, true]);

        // An order with no player id at all means listRedemptions is still
        // the old build - it simply does not return these fields yet. Saying
        // so beats rendering an empty box and letting it look like the order
        // was placed without any delivery details.
        const fulfil = rows_.length
          ? rows_.map(([k, v, copyable]) => `
          <div>
            <span class="k">${escapeHtml(k)}</span>
            <span class="v${copyable ? " copy" : ""}"
                  ${copyable ? `data-copy="${escapeHtml(v)}" title="Click to copy"` : ""}
            >${escapeHtml(v)}</span>
          </div>`).join("")
          : `<div><span class="k">Fulfilment details unavailable</span>
             <span class="v">deploy listRedemptions</span></div>`;

        card.innerHTML = `
          <div class="row">
            <div>
              <div class="title amount">${escapeHtml(amount)}</div>
              <div class="muted">
                ${escapeHtml(r.userDisplayName || "")}
                ${r.userEmail ? "&middot; " + escapeHtml(r.userEmail) : ""}
              </div>
              <div class="muted">${fmtDate(r.createdAtMillis)}</div>
              <div class="support-id">Order ${escapeHtml(supportId)}
                ${r.firstRedeem ? '<span class="first-badge">first redeem</span>' : ""}
                ${deviceBadge(r)}
                ${firstRedeemBadge(r)}
              </div>
            </div>
            <div style="text-align:right">
              <div class="cost">${Number(r.pointsCost || 0).toLocaleString()}</div>
              <div class="cost-sub">stars charged</div>
              <div class="status ${escapeHtml(r.status)}">${escapeHtml(r.status)}</div>
            </div>
          </div>
          <div class="fulfil">${fulfil}</div>
        `;

        for (const badge of card.querySelectorAll("[data-device]")) {
          badge.onclick = async () => {
            try {
              await navigator.clipboard.writeText(badge.dataset.device);
              banner("Copied device id " + badge.dataset.device, "ok");
            } catch {
              banner("Could not copy the device id.");
            }
          };
        }

        for (const target of card.querySelectorAll("[data-copy]")) {
          target.onclick = async () => {
            try {
              await navigator.clipboard.writeText(target.dataset.copy);
              banner(`Copied ${target.dataset.copy}`, "ok");
            } catch {
              banner("Could not copy - select the text instead.");
            }
          };
        }

        if (r.status === "pending") {
          const actions = document.createElement("div");
          actions.className = "actions";

          const approve = document.createElement("button");
          approve.className = "approve";
          approve.textContent = "Mark paid";
          approve.onclick = () => resolve(r.id, "approved", actions);

          const reject = document.createElement("button");
          reject.className = "reject";
          reject.textContent = "Reject & refund";
          reject.onclick = () => {
            // The reason is shown TO THE USER in the app, on the declined
            // sheet. Naming the device there hands a farmer the one fact they
            // need - that a factory reset clears it - so the prompt says so
            // rather than trusting everyone to remember.
            const reason = prompt(
              "Reason for rejection (shown to the user - do not mention the " +
              "device or how it was detected):",
            );
            // Cancel on the reason prompt means cancel the rejection. It used
            // to mean "no reason given, carry on", so a slip of the hand
            // rejected an order and refunded it with no explanation attached.
            if (reason === null) return;

            // WHAT HAPPENS TO THE DISCOUNT, and it is a real decision rather
            // than a formality - only you know why you rejected this. A
            // mistyped UID should get the offer back; an account caught
            // farming it should not. Defaults to giving it back, because the
            // usual rejection is an honest mistake and silently costing
            // somebody their one discount is the worse way to be wrong.
            //
            // Restoring also releases the per-UID mark on the game account
            // they entered, so the offer they get back is one they can
            // actually spend.
            let restoreFirstRedeem = true;
            if (r.firstRedeem) {
              restoreFirstRedeem = confirm(
                "This order used the first-redeem discount.\n\n" +
                "OK - give the discount back (mistyped UID, our error, " +
                "out of stock)\n" +
                "Cancel - keep it spent (abuse, farming, duplicate account)",
              );
            }
            resolve(r.id, "rejected", actions, reason, restoreFirstRedeem);
          };

          actions.append(approve, reject);
          card.append(actions);
        }

        listEl.append(card);
      }
    }

    /**
     * How many accounts have been seen on the ordering device.
     *
     * A SIGNAL, NOT A VERDICT. Two accounts on one phone is a family sharing
     * a device as often as it is one person farming, and nothing the server
     * can measure tells those apart - so this is a number beside an order and
     * the decision stays yours.
     *
     * It is also deliberately not enforced anywhere. An account rejected
     * automatically on device reuse teaches whoever is farming precisely which
     * signal to defeat, and the workaround is a factory reset away. A
     * rejection that arrives by hand, with a reason that never mentions the
     * device, does not.
     *
     * The badge is clickable to copy the full id, for cross-referencing orders
     * that are not on screen together.
     */
    function deviceBadge(r) {
      const count = Number(r.deviceAccountCount || 0);
      const id = String(r.androidId || "");

      if (!id || count === 0) {
        return '<span class="device-badge unknown" title="No device recorded' +
          ' for this account - it predates device tracking, or the install' +
          ' returned nothing.">device unknown</span>';
      }
      const short = escapeHtml(id.slice(0, 8));
      if (count === 1) {
        return `<span class="device-badge" data-device="${escapeHtml(id)}"
          title="Only this account has been seen on this device.">device ${short}</span>`;
      }
      return `<span class="device-badge shared" data-device="${escapeHtml(id)}"
        title="This device has been used by ${count} accounts. Judge it yourself - do not reject on this alone."
        >device ${short} &middot; used &times;${count}</span>`;
    }

    /**
     * How many DISCOUNTED FIRST redeems the ordering device has placed, across
     * every account on it - this order included when it is one.
     *
     * The app no longer hides the offer on a reused phone, so this is where a
     * repeat shows up. Same rule as the device badge: yours to judge, and a
     * rejection should not say which signal it was.
     */
    function firstRedeemBadge(r) {
      const firsts = Number(r.deviceFirstRedeemCount || 0);
      if (!r.androidId || firsts === 0) return "";
      const repeat = r.firstRedeem ? firsts > 1 : firsts > 0;
      return `<span class="device-badge${repeat ? " shared" : ""}"
        title="Discounted first redeems placed from this device, all accounts.">first redeems &times;${firsts}</span>`;
    }

    async function resolve(
      redemptionId, status, actionsEl, reason = "", restoreFirstRedeem = true,
    ) {
      if (status === "approved" &&
          !confirm("Only do this AFTER you have actually sent the payout. Continue?")) {
        return;
      }

      for (const b of actionsEl.querySelectorAll("button")) b.disabled = true;
      try {
        const res = await httpsCallable(fns, "resolveRedemption")({
          redemptionId, status, reason, restoreFirstRedeem,
        });
        const refunded = res.data?.refunded || 0;
        // Says whether the discount came back, because it is the half of a
        // rejection that is invisible otherwise - the stars show up in the
        // balance, the offer just quietly is or is not there.
        const discount = res.data?.firstRedeemRestored
          ? " First-redeem discount given back."
          : "";
        banner(
          status === "rejected"
            ? `Rejected. ${refunded.toLocaleString()} stars refunded.${discount}`
            : "Marked as paid.",
          "ok",
        );
        load();
      } catch (e) {
        banner(e.message);
        for (const b of actionsEl.querySelectorAll("button")) b.disabled = false;
      }
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }
  </script>
</body>
</html>
